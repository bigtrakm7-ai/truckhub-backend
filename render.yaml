services:
  - type: web
    name: truckgrad-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: truckgrad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://truckgrad.ru,https://www.truckgrad.ru"

  - type: redis
    name: truckgrad-redis
    ipAllowList: []

databases:
  - name: truckgrad-db
    databaseName: truckgrad
    user: truckgrad
